<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="github-markdown.css">
<link rel="stylesheet" href="katex.min.css">
<link rel="stylesheet" href="hljs-github.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="hljs-github-dark.min.css" media="(prefers-color-scheme: dark)">
<style>
  body {
    margin: 0;
    padding: 8px 20px 32px;
    background: transparent;
  }
  .markdown-body {
    box-sizing: border-box;
    margin: 0;
    /* Left-aligned, full width; transparent background lets the native
       window background show through. */
    background-color: transparent !important;
  }
  /* Code blocks scroll horizontally instead of wrapping. */
  .markdown-body pre {
    overflow-x: auto;
  }
</style>
</head>
<body>
<article id="content" class="markdown-body"></article>
<script src="markdown-it.min.js"></script>
<script src="katex.min.js"></script>
<script src="auto-render.min.js"></script>
<script src="highlight.min.js"></script>
<script>
  const md = markdownit({ html: true, linkify: true, breaks: false });

  // Reports content height to the native layer (chat bubbles size to fit).
  if (window.webkit && webkit.messageHandlers && webkit.messageHandlers.contentHeight) {
    const reportHeight = () =>
      webkit.messageHandlers.contentHeight.postMessage(document.body.scrollHeight);
    new ResizeObserver(reportHeight).observe(document.body);
  }

  // In-document anchor jumps (#heading links, e.g. a table of contents).
  // Headings get GitHub-style slug ids after each render; clicks on fragment
  // links are resolved here so they never trigger a web view navigation.
  document.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || !href.startsWith('#') || href.length < 2) return;
    e.preventDefault();
    let id = href.slice(1);
    try { id = decodeURIComponent(id); } catch (err) {}
    const target = document.getElementById(id)
      || document.getElementById('user-content-' + id)
      || document.getElementsByName(id)[0]
      || document.getElementsByName('user-content-' + id)[0];
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Assigns GitHub-style slug ids to headings so #anchor links have a target.
  function addHeadingAnchors(container) {
    const slugCounts = {};
    container.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach(h => {
      if (h.id) return;
      let slug = h.textContent.trim().toLowerCase()
        .replace(/[^\p{L}\p{N}\p{M}_\- ]/gu, '')
        .replace(/ /g, '-');
      const count = slugCounts[slug] || 0;
      slugCounts[slug] = count + 1;
      if (count > 0) slug = slug + '-' + count;
      h.id = slug;
    });
  }

  // GitHub-hosted images are loaded natively (with the auth token, so private
  // repositories work too) and swapped in as data URLs by setImageData().
  function collectProtectedImages() {
    if (!(window.webkit && webkit.messageHandlers && webkit.messageHandlers.loadImages)) return;
    const jobs = [];
    document.querySelectorAll('#content img').forEach((img, index) => {
      const src = img.getAttribute('src') || '';
      if (/^https:\/\/([^/]*\.)?(github\.com|githubusercontent\.com)(\/|$)/.test(src)) {
        jobs.push({ index: index, url: src });
      }
    });
    if (jobs.length) webkit.messageHandlers.loadImages.postMessage(jobs);
  }

  // Called from the native layer once an image has been downloaded.
  function setImageData(index, dataURL) {
    const img = document.querySelectorAll('#content img')[index];
    if (img) img.src = dataURL;
  }

  // Adjusts the base font size of the rendered content (points).
  function setFontSize(px) {
    document.getElementById('content').style.fontSize = px + 'px';
  }

  // Render entry point, called from the native layer.
  // markdown: raw Markdown; rawBase: base URL for relative images; blobBase: base URL for relative links
  function renderMarkdown(markdown, rawBase, blobBase) {
    const container = document.getElementById('content');

    // Extract math BEFORE markdown-it runs: otherwise underscores/asterisks
    // inside formulas get parsed as Markdown emphasis and the delimiters can
    // no longer be matched. Math is rendered with KaTeX right away and put
    // back via HTML placeholders that markdown-it passes through untouched.
    const math = [];
    const stashMath = (tex, display) => {
      try {
        math.push(katex.renderToString(tex.trim(), { displayMode: display, throwOnError: false }));
      } catch (e) {
        math.push(tex);
      }
      return math.length - 1;
    };
    let src = markdown;
    // ```math fenced blocks
    src = src.replace(/```math\s*\n([\s\S]*?)```/g, (m, tex) =>
      '\n\n<div data-math-placeholder="' + stashMath(tex, true) + '"></div>\n\n');
    // $$ ... $$ display math (may span multiple lines/paragraphs)
    src = src.replace(/\$\$([\s\S]+?)\$\$/g, (m, tex) =>
      '\n\n<div data-math-placeholder="' + stashMath(tex, true) + '"></div>\n\n');
    // $ ... $ inline math (single line, no spaces next to the delimiters, not \$)
    src = src.replace(/(?<!\\)\$([^\s$](?:[^$\n]*[^\s$])?)\$/g, (m, tex) =>
      '<span data-math-placeholder="' + stashMath(tex, false) + '"></span>');

    container.innerHTML = md.render(src);

    // Swap the placeholders for the rendered KaTeX.
    container.querySelectorAll('[data-math-placeholder]').forEach(el => {
      el.innerHTML = math[Number(el.getAttribute('data-math-placeholder'))];
      el.removeAttribute('data-math-placeholder');
    });

    // Relative image URLs → absolute raw URLs
    if (rawBase) {
      container.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src');
        if (src && !/^[a-zA-Z][a-zA-Z0-9+.\-]*:/.test(src)) {
          img.src = new URL(src, rawBase).href;
        }
      });
    }

    // Relative links → absolute github.com URLs; #anchors stay in-page
    if (blobBase) {
      container.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href');
        if (!href || href.startsWith('#')) return;
        if (!/^[a-zA-Z][a-zA-Z0-9+.\-]*:/.test(href)) {
          a.href = new URL(href, blobBase).href;
        }
      });
    }

    // Syntax highlighting
    container.querySelectorAll('pre code').forEach(el => {
      try { hljs.highlightElement(el); } catch (e) {}
    });

    addHeadingAnchors(container);
    collectProtectedImages();
  }
</script>
</body>
</html>
